{% set name = "curio" %}
{% set version = "1.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 562a586db20216ba7d2be8263deb9eb079e56048f9b8906d11d5f45aa81c5247
  patches:
    - patches/0001-3.12-compatibility.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip : true # [py<37]

requirements:
  build:
    - patch # [unix]
    - m2-patch # [win]
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  source_files:
    - tests
    - setup.cfg
  requires:
    - pytest
    - pip
  imports:
    - {{ name }}
  commands:
    - pytest -m "not internet"
    - pip check

about:
  home: https://curio.readthedocs.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: The coroutine concurrency library.
  description: |
    Curio is a coroutine-based library for concurrent Python systems programming. 
    It provides standard programming abstractions such as as tasks, sockets, files, 
    locks, and queues. You will find it to be familiar, small, fast, and fun.
  doc_url: https://curio.readthedocs.io/
  dev_url: https://github.com/dabeaz/curio

extra:
  recipe-maintainers:
    - scopatz
    - jochym
